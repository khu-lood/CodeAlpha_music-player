<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pinterest Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay"></div>

<div class="player">

    <div class="toggle-container">
        🌙 <input type="checkbox" id="theme-toggle">
    </div>

    <div class="cover-container">
        <img id="cover">
    </div>

    <h2 id="title">Title</h2>
    <p id="artist">Artist</p>

    <audio id="audio"></audio>

    <div class="sound-wave" id="wave">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="volume-container">
        <span class="volume-label">🎸 Volume</span>
        <div class="guitar-slider">
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <div class="progress-wrapper">

    <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <button id="like" class="heart-btn">🤍</button>

</div>

    <div class="time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">

    <button id="shuffle" class="side-btn">🔀</button>

    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>

    <button id="repeat" class="side-btn">🔁</button>

</div>

    

    <!-- 👇 PLAYLIST AT THE VERY BOTTOM -->
    <button id="playlist-toggle">Playlist 🎧🎀🌷</button>

    <div class="playlist-drawer" id="playlist-drawer">
        <ul id="playlist"></ul>
    </div>

</div>


<script src="script.js"></script>
</body>
</html>
